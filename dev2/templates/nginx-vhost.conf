# __SITE__: managed by cli-tools/dev2/dev2-site vhost. Do not hand-edit; re-run
# `dev2-site vhost __SITE__` after changing the template.
# The app runs in Docker on 127.0.0.1:__APP_PORT__; nginx is its only public face.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __SERVER_NAMES__;

    ssl_certificate     /etc/nginx/ssl/__SITE__/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/__SITE__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size __MAX_BODY__;

    # While a deploy recreates the container nginx gets "connection refused" and answers
    # 502 itself: send that to the site's static maintenance page, as a 503 with
    # Retry-After. proxy_intercept_errors stays off, so a 5xx the app sends (an API's
    # JSON error) passes through untouched. error_page turns a POST into a GET, so the
    # static file answers every method. No page on disk: a plain 503.
    error_page 502 503 504 =503 /__maintenance.html;
    location = /__maintenance.html {
        internal;
        root /var/www/maintenance/__SITE__;
        try_files $uri =503;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
        # Response headers are read into proxy_buffer_size even with buffering
        # off. Supabase SSR auth sets several chunked sb-*-auth-token cookies on
        # login, which overflow the 4k/8k default: nginx logs "upstream sent too
        # big header" and every successful sign-in becomes a 502.
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
    }
}
