<!doctype html>
<!-- __DOMAIN__: rendered by cli-tools dev2/dev2-site vhost. nginx serves this as a 503
     while the app container is down (a deploy, a restart). No external requests. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="15">
<meta name="robots" content="noindex">
<meta name="theme-color" content="__ACCENT__">
<title>__NAME__ is updating</title>
__FAVICON__
<style>
  :root { --bg: #f7f7f8; --fg: #16181d; --muted: #5d6270; --card: #ffffff; --line: #e3e5ea; --accent: __ACCENT__; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --fg: #eceef2; --muted: #9aa0ad; --card: #171a21; --line: #262a33; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px;
         background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { width: 100%; max-width: 440px; padding: 36px 28px; text-align: center;
         background: var(--card); border: 1px solid var(--line); border-radius: 16px;
         border-top: 4px solid var(--accent); }
  .logo { display: block; width: 64px; height: 64px; margin: 0 auto 18px; object-fit: contain; border-radius: 12px; }
  .mark { display: inline-block; margin-bottom: 14px; font-weight: 700; font-size: 1.05rem;
          letter-spacing: .01em; color: var(--accent); overflow-wrap: anywhere; }
  h1 { margin: 0 0 8px; font-size: 1.35rem; line-height: 1.3; overflow-wrap: anywhere; }
  p { margin: 0; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%;
         background: var(--accent); vertical-align: middle; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<main>
  __LOGO__
  <h1>__NAME__ is updating.</h1>
  <p><span class="dot" aria-hidden="true"></span>Back in a moment. This page reloads by itself.</p>
</main>
</body>
</html>
