# c0mpute gateway for dev2 worker (:7777): hosting sites (/s/<site_id>/), storage, opendisk.
# Announced as gateway.announce so the Moshpit edge and d1sks can reach it. 2026-11-09 riotcoder
server {
    listen 80;
    listen [::]:80;
    server_name gateway.c0mpute.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    http2 on;
    server_name gateway.c0mpute.com;
    ssl_certificate     /etc/nginx/ssl/gateway.c0mpute.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/gateway.c0mpute.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    client_max_body_size 64m;
    # Git hosting goes to vienna (node AmaKBdpB, 2900 GiB budget): the dev2 disk
    # is full, so the dev2 node refuses pushes (507). Pushes are owner-signed and
    # hash-checked end to end, so the plain-HTTP hop does not weaken them.
    # 2026-11-09 riotcoder
    location ^~ /git/ {
        client_max_body_size 1100m;
        proxy_pass http://dev.chovy.com:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
