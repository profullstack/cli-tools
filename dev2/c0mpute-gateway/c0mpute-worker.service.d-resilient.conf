# dev2: c0mpute-worker is the gateway behind gateway.c0mpute.com and the Moshpit c0mpute edge.
# Restart=on-failure left it dead after a clean exit or a TERM (2026-11-08 15:44 .. 11-09 12:01).
# Always come back, never hit a start limit, and back off up to a minute when it crash-loops
# (for example while a hand-run worker still holds :7777).
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=2
RestartSteps=6
RestartMaxDelaySec=60
