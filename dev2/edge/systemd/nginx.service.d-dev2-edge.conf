# managed by cli-tools/dev2/dev2-edge (installed as /etc/systemd/system/nginx.service.d/dev2-edge.conf)
# Every start and reload first moves any `listen 443` a tool wrote behind the edge
# stream proxy: with the stream on :443, such a line passes `nginx -t` but the reload
# cannot bind and nginx silently keeps its old configuration (a start fails outright).
# The leading "-" keeps a broken rewrite from blocking nginx itself.
[Service]
ExecStartPre=
ExecStartPre=-/usr/local/sbin/nginx-edge-listen --quiet
ExecStartPre=/usr/sbin/nginx -t -q -g 'daemon on; master_process on;'
ExecReload=
ExecReload=-/usr/local/sbin/nginx-edge-listen --quiet
ExecReload=/usr/sbin/nginx -g 'daemon on; master_process on;' -s reload
